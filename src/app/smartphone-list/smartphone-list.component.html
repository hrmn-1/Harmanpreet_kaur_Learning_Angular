<table>
  <thead>
  <tr>
    <th>Model</th>
    <th>Color</th>
    <th>Size</th>
    <th>Price</th>
    <th>Waterproof</th>
    <th>Actions</th>
  </tr>
  </thead>
  <tbody>
  <tr *ngFor="let smartphone of smartPhoneList">
    <td>{{ smartphone.model }}</td>
    <td>{{ smartphone.color }}</td>
    <td>{{ smartphone.size }}</td>
    <td>{{ smartphone.price }}</td>
    <td>{{ smartphone.isWaterproof }}</td>
    <td>
      <button [routerLink]="['/smartphone', smartphone.model]" class="btn btn-primary">Edit</button>
      <button (click)="deleteSmartphone(smartphone.model)" class="btn btn-danger">Delete</button>
    </td>
  </tr>
  </tbody>
</table>
