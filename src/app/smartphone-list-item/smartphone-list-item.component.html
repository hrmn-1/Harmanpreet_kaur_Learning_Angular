<div *ngIf="smartphone" class="smartphone-list-item">
  <mat-card class="smartphone-card">
    <mat-card-header>
      <mat-card-title>Smartphone Details</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <p><strong>Model:</strong> {{ smartphone.model }}</p>
      <p><strong>Color:</strong> {{ smartphone.color }}</p>
      <p><strong>Size:</strong> {{ smartphone.size }}</p>
      <p><strong>Price:</strong> {{ smartphone.price}}</p>
      <p><strong>Waterproof:</strong> {{ smartphone.isWaterproof }}</p>
    </mat-card-content>
  </mat-card>

  <button mat-raised-button color="primary" (click)="goBackward()" [disabled]="currentIndex === 0">
    <mat-icon> arrow_back</mat-icon>previous
  </button>
  <button mat-raised-button color="primary" (click)="goForward()" [disabled]="currentIndex === smartphoneList.length - 1" >
    Next<mat-icon> arrow_forward</mat-icon></button>
  <button mat-raised-button color="accent" (click)="goBack()">
    smartphone to smartphone list
  </button>
  </div>


 <div *ngIf="error" mat-card class="error-card">
   <mat-card-content>{{error}}</mat-card-content>
 </div>
